name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./...

  litecoin-swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LITECOIN_VERSION: 0.21.5.8
      LITECOIN_ARCHIVE_SHA256: 43200c9f9d65ebc126ea5833ca9429e144c4b3273da6bb9f4e89fd7450ab1be9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - name: Install verified Litecoin Core
        shell: bash
        run: |
          set -euo pipefail
          archive="litecoin-${LITECOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          url="https://github.com/litecoin-project/litecoin/releases/download/v${LITECOIN_VERSION}/${archive}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "$url"
          echo "${LITECOIN_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir "${RUNNER_TEMP}/litecoin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/litecoin" --strip-components=1
          echo "LITECOIND=${RUNNER_TEMP}/litecoin/bin/litecoind" >> "$GITHUB_ENV"
      - run: go mod verify
      - name: Test QDAY and Litecoin atomic swaps
        run: go test -tags=integration ./internal/daemon -run '^TestQdayLitecoinAtomicSwap$' -count=1 -v -timeout=5m
